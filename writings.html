<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Tulisan dan catatan Akbar Pratama.">
<meta name="theme-color" content="#f7f8fc"><title>Writing — Akbar Pratama</title>
<script src="api-config.js"></script>
<style>
:root{--bg:#f7f8fc;--paper:#fff;--ink:#172033;--muted:#667085;--line:#e2e7ef;--blue:#3659a8;--gold:#b87326}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}.top{position:sticky;top:0;background:#ffffffeb;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{max-width:960px;margin:auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.top a{font-weight:700;color:var(--blue);font-size:.9rem}
main{max-width:900px;margin:auto;padding:72px 24px 90px}
.kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
h1{font:500 clamp(3rem,8vw,5.5rem)/1 Georgia,serif;letter-spacing:-.07em;margin:14px 0}
.intro{color:var(--muted);max-width:570px;margin:0 0 42px}
.headrow{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
.headrow h2{font:500 1.7rem Georgia,serif;margin:0}.count{font: .72rem ui-monospace,monospace;color:#8993a5}
.feed{display:grid;gap:14px;margin-top:20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px 28px;box-shadow:0 10px 28px #24365a0a;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#c6d3ed;box-shadow:0 15px 34px #24365a14}
.meta{font:700 .68rem ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
h3{font:500 clamp(1.5rem,4vw,2.1rem)/1.15 Georgia,serif;margin:10px 0 8px}
.excerpt{color:#59657b;margin:0 0 12px}.read{color:var(--blue);font-weight:800;font-size:.84rem}
.empty{padding:38px;border:1px dashed #cbd4e2;border-radius:14px;color:var(--muted);background:#fff}
footer{text-align:center;border-top:1px solid var(--line);padding:24px;color:#8993a5;font-size:.78rem}
.back{display:inline-block;margin-bottom:26px;color:var(--blue);font-weight:800;font-size:.86rem}
.full h1{font:500 clamp(2.4rem,7vw,4.4rem)/1.08 Georgia,serif;letter-spacing:-.06em;margin:16px 0}
.full .excerpt{font-size:1.1rem;padding-bottom:28px;border-bottom:1px solid var(--line)}
.content{margin-top:36px;font:17px/1.85 Georgia,serif}.content p{margin:0 0 1.35em}
.content h2{font:500 1.8rem Georgia,serif;margin:1.8em 0 .6em}
.content blockquote{margin:1.5em 0;padding:12px 20px;border-left:3px solid var(--blue);background:#edf2fb;color:#45536c}
@media(max-width:600px){main{padding:48px 17px 70px}.topin{padding:14px 17px}.card{padding:22px}}
</style></head><body>
<header class="top"><div class="topin"><a href="index.html">← Portofolio</a><strong>AKBAR PRATAMA / WRITING</strong></div></header>
<main><div class="kicker">Catatan, ide, dan proses belajar</div><h1>Writing<span style="color:#3659a8">.</span></h1>
<p class="intro">Kumpulan tulisan yang saya bagikan secara publik. Pilih tulisan untuk membaca halaman lengkapnya.</p>
<div class="headrow"><h2>Semua tulisan</h2><span class="count" id="count">MEMUAT…</span></div>
<section class="feed" id="feed" aria-live="polite"><div class="empty">Memuat daftar tulisan…</div></section>
</main><footer>© <span id="year"></span> Akbar Pratama · Dibuat sambil belajar.</footer>
<script type="module">
document.getElementById("year").textContent=new Date().getFullYear();
const main=document.querySelector("main"),listHTML=main.innerHTML;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function bodyHtml(t){return String(t||"").split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";
 if(b.startsWith("### "))return"<h2>"+esc(b.slice(4))+"</h2>";
 if(b.startsWith("> "))return"<blockquote>"+esc(b.slice(2)).replace(/\n/g,"<br>")+"</blockquote>";
 return"<p>"+esc(b).replace(/\n/g,"<br>")+"</p>"}).join("")}
let items=null,failed=false;
function show(){
 const id=decodeURIComponent(location.hash.slice(1));
 if(id){const it=(items||[]).find(x=>x.id===id);
  main.innerHTML='<a class="back" href="#">← Semua tulisan</a>'+(it?
   '<article class="full"><div class="meta">'+esc([it.tag,it.date].filter(Boolean).join(" · "))+'</div><h1>'+esc(it.title)+'</h1>'+(it.excerpt?'<p class="excerpt">'+esc(it.excerpt)+'</p>':'')+'<div class="content">'+bodyHtml(it.body)+'</div></article>'
   :'<div class="empty">'+(items?"Tulisan tidak ditemukan.":"Memuat…")+'</div>');return}
 main.innerHTML=listHTML;const feed=document.getElementById("feed"),count=document.getElementById("count");
 if(failed){count.textContent="0 TULISAN";feed.innerHTML='<div class="empty">Daftar tulisan belum bisa dimuat. Periksa koneksi database Cloudflare (D1).</div>';return}
 if(!items)return;
 count.textContent=String(items.length).padStart(2,"0")+" TULISAN";
 if(!items.length){feed.innerHTML='<div class="empty">Belum ada tulisan yang diterbitkan.</div>';return}
 feed.replaceChildren(...items.map(item=>{
  const a=document.createElement("a");a.className="card";a.href="#"+item.id;
  const meta=document.createElement("div");meta.className="meta";meta.textContent=[item.tag,item.date].filter(Boolean).join(" · ")||"CATATAN";
  const h=document.createElement("h3");h.textContent=item.title||"Tanpa judul";
  const p=document.createElement("p");p.className="excerpt";p.textContent=item.excerpt||"Baca tulisan selengkapnya.";
  const read=document.createElement("span");read.className="read";read.textContent="Baca tulisan ↗";
  a.append(meta,h,p,read);return a}))}
window.addEventListener("hashchange",()=>{show();scrollTo(0,0)});
let last="";
async function load(){
 try{const r=await fetch(window.WRITING_API,{cache:"no-store"});if(!r.ok)throw 0;const t=await r.text();
  if(t!==last){last=t;items=JSON.parse(t);failed=false;show()}}
 catch(e){if(!items){failed=true;show()}}}
load();setInterval(()=>{if(!document.hidden)load()},60000);
</script></body></html>
