<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════╗
  ║  ADMIN-WRITING.HTML — EDITOR AKBAR                   ║
  ║  Login diperiksa oleh Worker (server), bukan browser. ║
  ║  Sandi: variabel rahasia ADMIN_PASSWORD di Cloudflare. ║
  ╚══════════════════════════════════════════════════════╝
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <!-- Gerbang sisi-browser bukan pengganti autentikasi hosting. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noodp">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Admin Writing — Akbar Pratama</title>
  <!-- Tidak ada favicon yang memberi petunjuk identitas -->
  <style>
    :root {
      --bg:      #f7f4ee;
      --paper:   #faf8f4;
      --white:   #ffffff;
      --ink:     #1c1c1a;
      --ink2:    #3a3832;
      --smoke:   #7a7570;
      --fog:     #b0aa9f;
      --rule:    #ddd8ce;
      --forest:  #2b5540;
      --amber:   #c86820;
      --red:     #d14343;
      --green:   #2a7a4b;
      --serif:   Georgia, "Times New Roman", serif;
      --sans:    "Segoe UI", system-ui, sans-serif;
      --mono:    ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ---- GATE ---- */
    #gate {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; padding: 32px;
    }
    .gate-logo {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--forest); display: grid; place-items: center; margin-bottom: 4px;
    }
    .gate-logo svg { width: 26px; height: 16px; }
    #gate h1 {
      font-family: var(--serif); font-size: 1.5rem; font-weight: 500;
      color: var(--ink); letter-spacing: -.03em;
    }
    #gate p { color: var(--smoke); font-size: .85rem; text-align: center; max-width: 300px; }
    #gate input {
      width: min(100%, 300px);
      padding: 11px 15px; border-radius: 8px;
      border: 1.5px solid var(--rule);
      background: var(--white); color: var(--ink);
      font-family: var(--mono); font-size: .9rem; outline: none;
      transition: border-color .15s;
    }
    #gate input:focus { border-color: var(--forest); }
    #gate button {
      width: min(100%, 300px);
      padding: 11px; border-radius: 8px;
      background: var(--forest); border: none; color: #fff;
      font-family: var(--sans); font-size: .88rem; font-weight: 700; cursor: pointer;
      transition: background .15s;
    }
    #gate button:hover { background: #1d3d2e; }
    .gate-err { color: var(--red); font-size: .78rem; display: none; }
    #gate.gone { display: none; }

    /* ---- APP SHELL ---- */
    #app { display: none; height: 100vh; flex-direction: column; }
    #app.visible { display: flex; }

    /* TOP BAR */
    .bar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 20px; min-height: 56px;
      background: var(--white); border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }
    .bar-left { display: flex; align-items: center; gap: 10px; }
    .bar-logo {
      width: 28px; height: 28px; border-radius: 7px;
      background: var(--forest); display: grid; place-items: center; flex-shrink: 0;
    }
    .bar-logo svg { width: 16px; height: 10px; }
    .bar-label {
      font-size: .78rem; font-weight: 800; letter-spacing: .08em;
      text-transform: uppercase; color: var(--smoke);
    }
    .bar-right { display: flex; align-items: center; gap: 8px; }
    .wc { font-family: var(--mono); font-size: .72rem; color: var(--fog); }
    .bar-btn {
      padding: 6px 14px; border-radius: 7px;
      font-family: var(--sans); font-size: .78rem; font-weight: 700; cursor: pointer;
      border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink2);
      transition: background .15s, border-color .15s;
    }
    .bar-btn:hover { background: var(--white); border-color: var(--fog); }
    .bar-btn.pub {
      background: var(--forest); border-color: var(--forest); color: #fff;
    }
    .bar-btn.pub:hover { background: #1d3d2e; }
    .bar-btn.del { color: var(--red); border-color: rgba(209,67,67,.3); }
    .bar-btn.del:hover { background: rgba(209,67,67,.07); border-color: var(--red); }

    /* BODY LAYOUT */
    .editor-layout {
      display: flex; flex: 1; overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 230px; flex-shrink: 0;
      border-right: 1px solid var(--rule);
      background: var(--paper);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sb-head {
      padding: 14px 14px 10px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--rule);
    }
    .sb-head-label {
      font-size: .68rem; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; color: var(--fog);
    }
    .sb-new {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 6px;
      background: var(--forest); color: #fff; border: none;
      font-family: var(--sans); font-size: .72rem; font-weight: 700; cursor: pointer;
      transition: background .15s;
    }
    .sb-new:hover { background: #1d3d2e; }
    .sb-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    .sb-item {
      padding: 10px 14px; cursor: pointer;
      border-bottom: 1px solid rgba(221,216,206,.5);
      transition: background .12s;
    }
    .sb-item:hover { background: var(--white); }
    .sb-item.active { background: var(--white); border-left: 2px solid var(--forest); }
    .sb-item-title {
      font-size: .82rem; font-weight: 600; color: var(--ink2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .sb-item-date { font-family: var(--mono); font-size: .62rem; color: var(--fog); }
    .sb-item-pub {
      display: inline-block; margin-top: 3px; padding: 1px 7px;
      border-radius: 999px; border: 1px solid rgba(43,85,64,.3);
      color: var(--forest); font-size: .58rem; font-weight: 800; letter-spacing: .06em;
    }

    /* EDITOR PANE */
    .editor-pane {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .editor-inner {
      max-width: 740px; width: 100%;
      margin: 0 auto; padding: 52px 40px 80px;
      flex: 1; display: flex; flex-direction: column;
    }

    .field-tag, .field-date {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .field-label {
      font-family: var(--mono); font-size: .68rem; font-weight: 800;
      letter-spacing: .1em; text-transform: uppercase; color: var(--fog);
      flex-shrink: 0; width: 46px;
    }
    .field-input {
      flex: 1; border: none; background: none; outline: none;
      font-family: var(--mono); font-size: .78rem; color: var(--smoke);
      border-bottom: 1px solid transparent;
      padding: 2px 0; transition: border-color .15s;
    }
    .field-input:focus { border-bottom-color: var(--rule); }

    .title-input {
      width: 100%; border: none; background: none; outline: none;
      font-family: var(--serif);
      font-size: clamp(1.9rem, 4vw, 2.8rem);
      font-weight: 500; letter-spacing: -.04em; line-height: 1.1;
      color: var(--ink); margin: 20px 0 6px;
      caret-color: var(--amber);
    }
    .title-input::placeholder { color: var(--rule); }

    .excerpt-input {
      width: 100%; border: none; background: none; outline: none;
      font-family: var(--sans); font-size: .9rem; color: var(--smoke);
      resize: none; line-height: 1.6; margin-bottom: 20px;
      caret-color: var(--amber);
    }
    .excerpt-input::placeholder { color: rgba(176,170,159,.6); }

    .divider { height: 1px; background: var(--rule); margin-bottom: 28px; }

    .body-input {
      flex: 1; width: 100%;
      border: none; background: none; outline: none;
      font-family: var(--serif); font-size: 1.08rem;
      line-height: 1.82; color: var(--ink2);
      resize: none; min-height: 440px;
      caret-color: var(--forest);
    }
    .body-input::placeholder { color: rgba(176,170,159,.6); }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 10px 20px; border-radius: 9px;
      font-size: .82rem; font-weight: 700;
      opacity: 0; pointer-events: none;
      transform: translateY(6px);
      transition: opacity .2s, transform .2s;
    }
    .toast.ok { background: var(--green); color: #fff; }
    .toast.pub-t { background: var(--forest); color: #fff; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* EMPTY PANE */
    .empty-pane {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      color: var(--fog); font-family: var(--serif); font-style: italic;
    }
    .empty-pane svg { width: 40px; height: 40px; opacity: .3; }

    @media (max-width: 600px) {
      .sidebar { display: none; }
      .editor-inner { padding: 36px 20px 60px; }
    }
  </style>
  <link rel="stylesheet" href="modern.css">
  <script src="api-config.js"></script>
</head>
<body class="editor-page">
<div id="gate" style="position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:#f7f4ee;padding:20px"><form id="g-form" style="width:min(380px,100%);background:#fff;border:1px solid #ddd8ce;border-radius:18px;padding:30px;font-family:system-ui,sans-serif"><h1 style="font:500 1.8rem Georgia,serif;margin:0 0 16px">Masuk</h1><input id="g-pw" type="password" placeholder="Kata sandi" autocomplete="current-password" required style="width:100%;padding:12px 14px;border:1.5px solid #ddd8ce;border-radius:12px;font:inherit;margin-bottom:12px"><button style="width:100%;padding:12px;border:0;border-radius:12px;background:#2b5540;color:#fff;font-weight:700;font:inherit;cursor:pointer">Masuk</button><div id="g-err" style="color:#b3261e;font-size:.85rem;min-height:1.3em;margin-top:10px" role="status"></div></form></div>

<!-- ==================== APP ==================== -->
<div id="app" class="visible">
  <!-- TOP BAR -->
  <div class="bar">
    <div class="bar-left">
      <div class="bar-logo" aria-hidden="true">
        <svg viewBox="0 0 16 10" fill="none">
          <path d="M.5 5h3l1.5-3.5 2 7 1.5-3.5 1.5 2.5h5.5" stroke="#e8c97a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="bar-label">Admin Writing · Draft & Publish</span>
    </div>
    <div class="bar-right">
      <span class="wc" id="wc">0 kata</span>
      <button class="bar-btn del" id="del-btn" title="Hapus tulisan ini">Hapus</button>
      <button class="bar-btn" id="save-btn">Simpan Draf</button>
      <button class="bar-btn pub" id="pub-btn" title="Tampilkan di portofolio sekarang">Terbitkan ↗</button>
    </div>
  </div>

  <!-- BODY -->
  <div class="editor-layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sb-head">
        <span class="sb-head-label">Draf</span>
        <button class="sb-new" id="new-btn">+ Baru</button>
      </div>
      <div class="sb-list" id="sb-list"></div>
    </div>

    <!-- EDITOR -->
    <div class="editor-pane">
      <div class="editor-inner" id="editor-inner"><p style="font: .78rem/1.6 Segoe UI, sans-serif;color:#667085;margin-bottom:24px;padding:12px 16px;background:#eef2fb;border:1px solid #dce5f4;border-radius:10px">Mode admin terbuka melalui URL <b>admin-writing.html</b>. Perubahan tersimpan otomatis. Tulisan yang sudah <b>diterbitkan</b> langsung berubah di halaman Writing portofolio secara real-time.</p>
        <div class="empty-pane" id="empty-pane">
          <svg viewBox="0 0 40 40" fill="none"><rect x="6" y="4" width="28" height="34" rx="4" stroke="currentColor" stroke-width="1.5"/><path d="M12 14h16M12 20h16M12 26h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Pilih draf atau buat yang baru
        </div>
        <div id="edit-fields" style="display:none; flex-direction:column; flex:1;">
          <div class="field-tag">
            <span class="field-label">TAG</span>
            <input class="field-input" id="f-tag" type="text" placeholder="misal: Refleksi, Belajar…" autocomplete="off">
          </div>
          <div class="field-date">
            <span class="field-label">TGL</span>
            <input class="field-input" id="f-date" type="text" placeholder="misal: November 2026" autocomplete="off">
          </div>
          <textarea class="title-input" id="f-title" rows="2" placeholder="Judul tulisan…" spellcheck="false"></textarea>
          <textarea class="excerpt-input" id="f-excerpt" rows="2" placeholder="Ringkasan singkat (opsional)…" spellcheck="false"></textarea>
          <div class="divider"></div>
          <textarea class="body-input" id="f-body"
            placeholder="Mulai menulis…&#10;&#10;Gunakan baris kosong untuk paragraf baru.&#10;Gunakan ### untuk subjudul.&#10;Gunakan > untuk kutipan."
            spellcheck="false"></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const API=window.WRITING_API;
let drafts=[],currentId=null,dirty=false,timer=null;
const IDS=["f-tag","f-date","f-title","f-excerpt","f-body"];
let PW=""; try{PW=sessionStorage.getItem("pw")||""}catch(e){}
async function api(method,qs,body){const r=await fetch(API+(qs||""),{method,headers:{"content-type":"application/json","authorization":"Bearer "+PW},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  if(!r.ok){const e=new Error((await r.json().catch(()=>({}))).error||r.status);e.status=r.status;throw e}return r.json()}
function gate(msg){document.getElementById("gate").style.display="flex";document.getElementById("g-err").textContent=msg||"";document.getElementById("g-pw").focus()}
document.getElementById("g-form").addEventListener("submit",async e=>{e.preventDefault();PW=document.getElementById("g-pw").value;
  try{await api("GET","?check=1");try{sessionStorage.setItem("pw",PW)}catch(_){}document.getElementById("gate").style.display="none";document.getElementById("g-pw").value="";load()}
  catch(er){PW="";document.getElementById("g-err").textContent=er.status===401?"Kata sandi salah.":"Gagal terhubung: "+er.message}});
function fields(){return{tag:$("f-tag").value.trim(),date:$("f-date").value.trim(),title:$("f-title").value.trim(),excerpt:$("f-excerpt").value.trim(),body:$("f-body").value}}
function cur(){return drafts.find(x=>x.id===currentId)}
async function flush(extra){if(!currentId||(!dirty&&!extra))return;clearTimeout(timer);dirty=false;
  const d=cur(),f={...fields(),...(extra||{})};Object.assign(d,f);
  try{await api("PUT","?id="+d.id,f)}catch(e){dirty=true;showToast("Gagal menyimpan: "+e.message,"ok")}}
function schedule(){dirty=true;clearTimeout(timer);timer=setTimeout(()=>flush(),700)}
async function load(){try{drafts=await api("GET","?all=1")}catch(e){if(e.status===401){gate();return}showToast("Gagal terhubung: "+e.message,"ok");return}
  renderSidebar();if(drafts.length)selectDraft(drafts[0].id);else createNew()}
function renderSidebar(){const list=$("sb-list");list.replaceChildren();drafts.forEach(d=>{
  const el=document.createElement("div");el.className="sb-item"+(d.id===currentId?" active":"");
  const title=document.createElement("div");title.className="sb-item-title";title.textContent=d.title||"Tanpa judul";
  const date=document.createElement("div");date.className="sb-item-date";date.textContent=d.date||"Draf";
  const status=document.createElement("span");status.className="sb-item-pub";status.textContent=d.published?"DITERBITKAN":"DRAF";
  el.append(title,date,status);el.addEventListener("click",async()=>{await flush();selectDraft(d.id)});list.append(el)})}
function fill(d){$("f-tag").value=d.tag||"";$("f-date").value=d.date||"";$("f-title").value=d.title||"";$("f-excerpt").value=d.excerpt||"";$("f-body").value=d.body||"";updateWC()}
function selectDraft(id){currentId=id;dirty=false;const d=cur();if(!d)return;
  $("empty-pane").style.display="none";$("edit-fields").style.display="flex";fill(d);renderSidebar()}
async function createNew(){await flush();
  const d={tag:"Catatan",date:new Date().toLocaleDateString("id-ID",{month:"long",year:"numeric"}),title:"",excerpt:"",body:"",published:false};
  try{const r=await api("POST","",d);d.id=r.id;d.updated=Date.now();drafts.unshift(d);selectDraft(d.id);$("f-title").focus()}
  catch(e){showToast("Gagal membuat: "+e.message,"ok")}}
async function saveDraft(){dirty=true;await flush();renderSidebar();showToast("Tersimpan ✓","ok")}
async function deleteDraft(){const d=cur();if(!d)return;
  if(!confirm("Hapus '"+(d.title||"tanpa judul")+"'? Jika sudah terbit, tulisan juga hilang dari portofolio."))return;
  clearTimeout(timer);dirty=false;
  try{await api("DELETE","?id="+d.id)}catch(e){showToast("Gagal menghapus: "+e.message,"ok");return}
  drafts=drafts.filter(x=>x.id!==d.id);currentId=null;
  if(drafts.length)selectDraft(drafts[0].id);else createNew();renderSidebar()}
async function publishDraft(){const d=cur();if(!d)return;const f=fields();
  if(!f.title||!f.body.trim()){showToast("Isi judul dan konten sebelum menerbitkan.","ok");return}
  if(!f.excerpt){f.excerpt=f.body.replace(/\s+/g," ").slice(0,170)+(f.body.length>170?"…":"");$("f-excerpt").value=f.excerpt}
  await flush({excerpt:f.excerpt,published:true});renderSidebar();
  showToast("Terbit — langsung tampil di portofolio ✓","pub-t")}
function updateWC(){const all=($("f-body").value+" "+$("f-title").value).trim();$("wc").textContent=(all?all.split(/\s+/).length:0)+" kata"}
function showToast(msg,type){const t=$("toast");t.textContent=msg;t.className="toast "+type+" show";clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove("show"),2600)}
$("new-btn").addEventListener("click",createNew);$("save-btn").addEventListener("click",saveDraft);$("del-btn").addEventListener("click",deleteDraft);$("pub-btn").addEventListener("click",publishDraft);
IDS.forEach(id=>$(id).addEventListener("input",()=>{updateWC();schedule();if(id==="f-title"){const d=cur();if(d){d.title=$("f-title").value;renderSidebar()}}}));
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveDraft()}});
window.addEventListener("beforeunload",()=>{if(dirty)flush()});
if(PW)load();else gate();
</script>
</body>
</html>
